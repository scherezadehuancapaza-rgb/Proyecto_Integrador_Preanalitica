{% extends "base.html" %}

{% block titulo %}Ingreso{% endblock %}

{% block contenido %}
<div class="container" style="margin-top: 100px; text-align: center;">
    <h1>Bienvenido a Preanalítica</h1>
    <p>Por favor, identifícate para comenzar.</p>
    
    {% if error %}
        <p style="color: red; font-weight: bold;">{{ error }}</p>
    {% endif %}
    
    <form action="/login" method="POST" style="display: inline-block; text-align: left; margin-top: 20px;">
        <label>Nombre:</label><br>
        <input type="text" name="nombre" required style="margin-bottom: 15px;"><br>
        
        <label>Apellido:</label><br>
        <input type="text" name="apellido" required style="margin-bottom: 20px;"><br>
        
        <button type="submit" class="btn btn-primario" style="width: 100%;">Ingresar</button>
    </form>
</div>
{% endblock %}
